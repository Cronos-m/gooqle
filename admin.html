<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Administrador - CyberNeumorfismo</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --surface: #161b22;
            --text-main: #8b949e;
            --text-heading: #c9d1d9;
            --shadow-light: rgba(48, 54, 61, 0.6);
            --shadow-dark: rgba(1, 4, 9, 0.9);
            --neon: #00f2fe;
            --neon-glow: rgba(0, 242, 254, 0.3);
            --danger: #ff5555;
            --border: #30363d;
        }

        body.light-mode {
            --bg-color: #e2e8f0;
            --surface: #edf2f7;
            --text-main: #4a5568;
            --text-heading: #1a202c;
            --shadow-light: #ffffff;
            --shadow-dark: #cbd5e1;
            --neon: #0284c7;
            --neon-glow: rgba(2, 132, 199, 0.25);
            --danger: #dc2626;
            --border: #cbd5e1;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            transition: background-color 0.3s ease;
        }

        /* Contenedor Dinámico: Compacto por defecto (Login) */
        .container {
            width: 100%;
            max-width: 360px;
            background: var(--surface);
            padding: 30px 25px;
            border-radius: 20px;
            border: 1px solid var(--border);
            box-shadow: 8px 8px 16px var(--shadow-dark), -8px -8px 16px var(--shadow-light);
            box-sizing: border-box;
            transition: max-width 0.3s ease, padding 0.3s ease;
        }

        /* Se expande solo cuando entra al Dashboard */
        .container.expanded {
            max-width: 900px;
            padding: 25px;
        }

        .login-container {
            text-align: center;
        }

        h1, h2 {
            color: var(--text-heading);
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        h1 { font-size: 20px; margin: 0 0 5px 0; text-shadow: 0 0 10px var(--neon-glow); }
        h2 { font-size: 16px; margin-top: 25px; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
        p { font-size: 13px; color: var(--text-main); margin: 0 0 20px 0; }

        input, select {
            width: 100%;
            padding: 12px 15px;
            margin: 6px 0 14px 0;
            background: var(--surface);
            border: 1px solid var(--border);
            outline: none;
            border-radius: 12px;
            box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light);
            color: var(--text-heading);
            font-size: 14px;
            box-sizing: border-box;
            transition: all 0.2s ease;
        }

        input:focus, select:focus {
            border-color: var(--neon);
            box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light), 0 0 10px var(--neon-glow);
        }

        button {
            width: 100%;
            padding: 12px 20px;
            margin: 8px 0;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--neon);
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 5px 5px 10px var(--shadow-dark), -5px -5px 10px var(--shadow-light);
            transition: all 0.15s ease;
        }

        button:hover {
            color: var(--text-heading);
            text-shadow: 0 0 8px var(--neon);
            box-shadow: 6px 6px 12px var(--shadow-dark), -6px -6px 12px var(--shadow-light);
        }

        button:active {
            box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light);
        }

        .forgot-pass {
            display: block;
            margin-top: 14px;
            font-size: 12px;
            color: var(--text-main);
            text-decoration: none;
            cursor: pointer;
        }
        .forgot-pass:hover { color: var(--neon); text-decoration: underline; }

        .danger-btn {
            color: var(--danger);
            width: auto;
            padding: 6px 12px;
            margin: 0;
            font-size: 12px;
        }
        .danger-btn:hover { text-shadow: 0 0 8px var(--danger); }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .icon-btn {
            background: var(--surface);
            border: 1px solid var(--border);
            width: 36px;
            height: 36px;
            padding: 0;
            margin: 0;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--neon);
            font-size: 15px;
        }
        .icon-btn:active { box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light); }

        /* Tablas Responsive */
        .table-responsive {
            width: 100%;
            overflow-x: auto;
            margin-top: 10px;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            min-width: 500px;
        }

        th, td {
            padding: 10px;
            text-align: left;
            font-size: 13px;
        }

        th {
            background: var(--surface);
            color: var(--text-heading);
            font-weight: bold;
            box-shadow: inset 2px 2px 4px var(--shadow-dark), inset -2px -2px 4px var(--shadow-light);
            border-bottom: 1px solid var(--border);
        }

        tr td { border-bottom: 1px solid var(--border); }

        .log-box {
            background: var(--surface);
            padding: 12px;
            height: 150px;
            overflow-y: auto;
            font-family: 'Courier New', Courier, monospace;
            font-size: 12px;
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-top: 10px;
            box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light);
            color: var(--neon);
        }

        #auth-section, #admin-dashboard { display: none; }
    </style>
</head>
<body>

    <div class="container" id="main-wrapper">
        <!-- LOGIN ADMIN (Tarjeta compacta 360px) -->
        <div id="auth-section" class="login-container">
            <div style="display: flex; justify-content: flex-end; margin-bottom: 5px;">
                <button class="icon-btn" id="theme-toggle-login" title="Cambiar tema">⚡</button>
            </div>
            <h1>SYS_ADMIN</h1>
            <p>Acceso seguro al núcleo.</p>
            <input type="email" id="admin-email" placeholder="Correo electrónico">
            <input type="password" id="admin-password" placeholder="Contraseña">
            <button id="btn-login">ACCEDER</button>
            <a class="forgot-pass" id="btn-forgot">¿Olvidaste tu contraseña?</a>
        </div>

        <!-- DASHBOARD ADMIN (Se expande a 900px al entrar) -->
        <div id="admin-dashboard">
            <div class="top-bar">
                <h1>Panel Maestro</h1>
                <div style="display: flex; gap: 10px;">
                    <button class="icon-btn" id="theme-toggle-dash" title="Cambiar tema">⚡</button>
                    <button class="icon-btn" id="btn-logout" title="Cerrar Sesión">🚪</button>
                </div>
            </div>
            <p>Control total de IDs, enlaces y registros privados.</p>
            
            <h2>Registrar / Asignar Mago</h2>
            <form id="magician-form">
                <input type="text" id="magod-id" placeholder="ID único (ej: carlos, andres)" required>
                <input type="text" id="magod-nombre" placeholder="Nombre del Mago" required>
                <input type="email" id="magod-correo" placeholder="Correo asignado" required>
                <button type="submit">Guardar Mago</button>
            </form>

            <h2>Magos Registrados</h2>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>ID / URL</th>
                            <th>Nombre</th>
                            <th>Correo</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="magos-table-body">
                        <!-- Dinámico -->
                    </tbody>
                </table>
            </div>

            <h2>Historial Privado de Búsquedas</h2>
            <select id="select-log-mago">
                <option value="">Selecciona un mago...</option>
            </select>
            <div class="log-box" id="log-content">Selecciona un mago arriba para ver su historial...</div>
        </div>
    </div>

    <!-- Scripts de Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <script src="js/firebase-config.js"></script>

    <script>
        const mainWrapper = document.getElementById('main-wrapper');
        const authSection = document.getElementById('auth-section');
        const adminDashboard = document.getElementById('admin-dashboard');
        const btnLogin = document.getElementById('btn-login');
        const btnLogout = document.getElementById('btn-logout');
        const btnForgot = document.getElementById('btn-forgot');
        const magicianForm = document.getElementById('magician-form');
        const magosTableBody = document.getElementById('magos-table-body');
        const selectLogMago = document.getElementById('select-log-mago');
        const logContent = document.getElementById('log-content');
        const themeToggleLogin = document.getElementById('theme-toggle-login');
        const themeToggleDash = document.getElementById('theme-toggle-dash');

        // Control de Tema Oscuro / Claro
        function toggleTheme() {
            document.body.classList.toggle('light-mode');
            const isLight = document.body.classList.contains('light-mode');
            localStorage.setItem('admin_theme', isLight ? 'light' : 'dark');
        }

        if (localStorage.getItem('admin_theme') === 'light') {
            document.body.classList.add('light-mode');
        }

        themeToggleLogin.onclick = toggleTheme;
        themeToggleDash.onclick = toggleTheme;

        // Auth Observer: Ajusta el tamaño del contenedor automáticamente
        auth.onAuthStateChanged(user => {
            if (user) {
                mainWrapper.classList.add('expanded');
                authSection.style.display = 'none';
                adminDashboard.style.display = 'block';
                cargarDatosAdmin();
            } else {
                mainWrapper.classList.remove('expanded');
                authSection.style.display = 'block';
                adminDashboard.style.display = 'none';
            }
        });

        btnLogin.onclick = () => {
            const email = document.getElementById('admin-email').value;
            const pass = document.getElementById('admin-password').value;
            auth.signInWithEmailAndPassword(email, pass).catch(err => alert("Error: " + err.message));
        };

        btnLogout.onclick = () => auth.signOut();

        // Recuperar contraseña
        btnForgot.onclick = () => {
            const email = document.getElementById('admin-email').value.trim();
            if (!email) {
                alert("Por favor, ingresa tu correo electrónico primero en el campo de arriba.");
                return;
            }
            auth.sendPasswordResetEmail(email)
                .then(() => alert("Se ha enviado un enlace de recuperación a tu correo."))
                .catch(err => alert("Error: " + err.message));
        };

        magicianForm.onsubmit = (e) => {
            e.preventDefault();
            const id = document.getElementById('magod-id').value.trim().toLowerCase();
            const nombre = document.getElementById('magod-nombre').value.trim();
            const correo = document.getElementById('magod-correo').value.trim();

            db.ref(`configuracion_magos/${id}`).update({
                nombre: nombre,
                correo: correo,
                actualizado: Date.now()
            }).then(() => {
                alert("¡Mago registrado con éxito!");
                magicianForm.reset();
            });
        };

        function cargarDatosAdmin() {
            db.ref('configuracion_magos').on('value', snapshot => {
                const data = snapshot.val();
                magosTableBody.innerHTML = '';
                selectLogMago.innerHTML = '<option value="">Selecciona un mago...</option>';

                if (data) {
                    Object.keys(data).forEach(id => {
                        const mago = data[id];
                        magosTableBody.innerHTML += `
                            <tr>
                                <td><b>#${id}</b></td>
                                <td>${mago.nombre || 'Sin nombre'}</td>
                                <td>${mago.correo || 'No asignado'}</td>
                                <td><button class="danger-btn" onclick="eliminarMago('${id}')">Eliminar</button></td>
                            </tr>
                        `;
                        selectLogMago.innerHTML += `<option value="${id}">${mago.nombre || id} (#${id})</option>`;
                    });
                }
            });
        }

        window.eliminarMago = function(id) {
            if (confirm(`¿Seguro que deseas eliminar al mago #${id}?`)) {
                db.ref(`configuracion_magos/${id}`).remove();
            }
        };

        selectLogMago.onchange = (e) => {
            const magoId = e.target.value;
            if (!magoId) {
                logContent.innerHTML = "Selecciona un mago arriba para ver su historial...";
                return;
            }

            db.ref(`logs_privados/${magoId}`).on('value', snapshot => {
                const logs = snapshot.val();
                logContent.innerHTML = '';
                if (logs) {
                    Object.values(logs).reverse().forEach(log => {
                        const fecha = new Date(log.timestamp).toLocaleString();
                        logContent.innerHTML += `[${fecha}] &rarr; <b>${log.palabra}</b><br>`;
                    });
                } else {
                    logContent.innerHTML = "No hay búsquedas registradas aún para este ID.";
                }
            });
        };
    </script>
</body>
</html>
